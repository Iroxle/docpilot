name: Bug report
description: Something in DocPilot does not work as expected.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a problem.
        **Please never attach confidential documents.** Black out anything sensitive in screenshots, or recreate the problem with a test document.
  - type: input
    id: version
    attributes:
      label: DocPilot version
      description: "Windows: Help > About DocPilot. Mac: DocPilot > About DocPilot."
      placeholder: "1.1.0"
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Windows 11
        - Windows 10
        - macOS on Apple silicon
        - macOS on Intel
    validations:
      required: true
  - type: input
    id: os-version
    attributes:
      label: System version
      description: For example "Windows 11 24H2" or "macOS 15.2".
  - type: dropdown
    id: install
    attributes:
      label: Installed with
      options:
        - Setup (DocPilot-Setup-x64.exe)
        - MSI (DocPilot-x64.msi)
        - Portable version (DocPilot-Portable-x64.exe)
        - Mac disk image (.dmg)
        - Built from source
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open a PDF with ...
        2. Choose ...
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What happened instead?
      description: Error messages and screenshots help a lot.
    validations:
      required: true
  - type: checkboxes
    id: confidential
    attributes:
      label: Confidential data
      options:
        - label: My report and its attachments contain no confidential or personal data.
          required: true
