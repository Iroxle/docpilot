# Builds the Windows installers and publishes them as a GitHub release.
#
# Release a new version:
#   1. Set the version in package.json and add a section for it to CHANGELOG.md.
#   2. Push to main.
# If there is no release for the version in package.json yet, this workflow builds the installers
# and publishes the release "v<version>". The release text is the CHANGELOG.md section of that version.
# Pushes that do not change the version only run the short check job.
#
# "Run workflow" on the Actions page builds the installers on demand. They can be downloaded from
# the workflow run as an artifact; tick "publish" to publish them as a release as well.

name: Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      publish:
        description: Publish a release for the version in package.json
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    name: Check whether a release is due
    # Releases are only published from the main repository, not from forks or copies.
    if: github.repository == 'Iroxle/docpilot'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.plan.outputs.version }}
      tag: ${{ steps.plan.outputs.tag }}
      build: ${{ steps.plan.outputs.build }}
      publish: ${{ steps.plan.outputs.publish }}
    steps:
      - name: Check out the code
        uses: actions/checkout@v5

      - name: Decide what to do
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLISH_INPUT: ${{ inputs.publish }}
        run: |
          version="$(node -p "require('./package.json').version")"
          tag="v$version"
          build=false
          publish=false
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            build=true
            publish="${PUBLISH_INPUT:-false}"
          elif [ "$GITHUB_REF_TYPE" = "tag" ]; then
            if [ "$GITHUB_REF_NAME" != "$tag" ]; then
              echo "::error::Tag $GITHUB_REF_NAME does not match version $version in package.json."
              exit 1
            fi
            build=true
            publish=true
          elif gh release view "$tag" > /dev/null 2>&1; then
            echo "Release $tag already exists. Nothing to do."
          else
            build=true
            publish=true
          fi
          if [ "$publish" = "true" ]; then
            # Fails early if CHANGELOG.md has no section for this version.
            node scripts/release-notes.js "$version" > /dev/null
          fi
          {
            echo "version=$version"
            echo "tag=$tag"
            echo "build=$build"
            echo "publish=$publish"
          } >> "$GITHUB_OUTPUT"
          echo "Version $version: build=$build, publish=$publish"

  windows:
    name: Windows installers (x64)
    needs: check
    if: needs.check.outputs.build == 'true'
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out the code
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check the code
        run: npm run lint

      - name: Build the installers (EXE setup, MSI, portable EXE)
        run: npm run dist

      - name: Create checksums
        working-directory: release
        run: sha256sum DocPilot-Setup-x64.exe DocPilot-x64.msi DocPilot-Portable-x64.exe > SHA256SUMS.txt

      - name: Keep the installers as a workflow artifact
        uses: actions/upload-artifact@v5
        with:
          name: DocPilot-${{ needs.check.outputs.version }}-windows-x64
          if-no-files-found: error
          path: |
            release/DocPilot-Setup-x64.exe
            release/DocPilot-x64.msi
            release/DocPilot-Portable-x64.exe
            release/SHA256SUMS.txt

      - name: Publish the release
        if: needs.check.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.check.outputs.tag }}
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          node scripts/release-notes.js "$VERSION" > release-notes.md
          files="release/DocPilot-Setup-x64.exe release/DocPilot-x64.msi release/DocPilot-Portable-x64.exe release/SHA256SUMS.txt"
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" $files --clobber
          else
            gh release create "$TAG" $files --target "$GITHUB_SHA" --title "DocPilot $VERSION" --notes-file release-notes.md
          fi
