# Builds the Windows installers and publishes them as a GitHub release.
#
# Release a new version:
#   1. Set the version in package.json and add a section for it to CHANGELOG.md.
#   2. Push a tag with the same version, for example:  git tag v1.0.3 && git push origin v1.0.3
# The release text comes from the CHANGELOG.md section of that version.
#
# "Run workflow" on the Actions page builds the installers without publishing a release;
# they can be downloaded from the workflow run as an artifact.

name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    name: Windows installers (x64)
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: bash

    steps:
      - name: Check out the code
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Check that the tag matches the version in package.json
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version="v$(node -p "require('./package.json').version")"
          if [ "$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match version $version in package.json."
            exit 1
          fi
          node scripts/release-notes.js > /dev/null

      - name: Install dependencies
        run: npm ci

      - name: Check the code
        run: npm run lint

      - name: Build the installers (EXE setup, MSI, portable EXE)
        run: npm run dist

      - name: Create checksums
        working-directory: release
        run: sha256sum DocPilot-Setup-x64.exe DocPilot-x64.msi DocPilot-Portable-x64.exe > SHA256SUMS.txt

      - name: Keep the installers as a workflow artifact
        uses: actions/upload-artifact@v5
        with:
          name: DocPilot-windows-x64
          if-no-files-found: error
          path: |
            release/DocPilot-Setup-x64.exe
            release/DocPilot-x64.msi
            release/DocPilot-Portable-x64.exe
            release/SHA256SUMS.txt

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node scripts/release-notes.js > release-notes.md
          files="release/DocPilot-Setup-x64.exe release/DocPilot-x64.msi release/DocPilot-Portable-x64.exe release/SHA256SUMS.txt"
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" $files --clobber
          else
            gh release create "$GITHUB_REF_NAME" $files --verify-tag --title "DocPilot ${GITHUB_REF_NAME#v}" --notes-file release-notes.md
          fi
