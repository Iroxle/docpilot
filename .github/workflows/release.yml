# Builds DocPilot for Windows and macOS, runs the tests and publishes a GitHub release.
#
# Release a new version:
#   1. Set the version in package.json and add a section for it to CHANGELOG.md.
#   2. Push to main.
# If there is no release for the version in package.json yet, this workflow runs the tests, builds the
# Windows installers and the Mac disk images and publishes the release "v<version>". The release text is
# the CHANGELOG.md section of that version. Pushes to main that do not change the version do nothing.
#
# Pushes to other branches and pull requests run the tests and build everything without publishing
# (the builds are made even if tests fail, to see both). The builds can be downloaded from the workflow
# run as artifacts. A release is only published when lint and all Windows tests pass. On macOS, the tests
# run as well, but failures are only reported as warnings (the app tests were written for Windows).
# "Run workflow" on the Actions page does the same on demand; tick "publish" to publish a release as well.
#
# Mac builds are signed and notarized when these repository secrets exist: MAC_CERTIFICATE (Developer ID
# Application certificate as base64 .p12), MAC_CERTIFICATE_PASSWORD, APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD,
# APPLE_TEAM_ID. Without them, the Mac app is only signed ad hoc (macOS asks once before the first start).

name: Release

on:
  push:
    branches:
      - '**'
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish a release for the version in package.json
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    name: Decide what to do
    # Releases are only published from the main repository, not from forks or copies.
    if: github.repository == 'Iroxle/docpilot'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.plan.outputs.version }}
      tag: ${{ steps.plan.outputs.tag }}
      build: ${{ steps.plan.outputs.build }}
      publish: ${{ steps.plan.outputs.publish }}
    steps:
      - name: Check out the code
        uses: actions/checkout@v5

      - name: Decide what to do
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLISH_INPUT: ${{ inputs.publish }}
        run: |
          version="$(node -p "require('./package.json').version")"
          tag="v$version"
          build=false
          publish=false
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            build=true
            publish="${PUBLISH_INPUT:-false}"
          elif [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            build=true
          elif [ "$GITHUB_REF_TYPE" = "tag" ]; then
            if [ "$GITHUB_REF_NAME" != "$tag" ]; then
              echo "::error::Tag $GITHUB_REF_NAME does not match version $version in package.json."
              exit 1
            fi
            build=true
            publish=true
          elif [ "$GITHUB_REF_NAME" != "main" ]; then
            build=true
          elif gh release view "$tag" > /dev/null 2>&1; then
            echo "Release $tag already exists. Nothing to do."
          else
            build=true
            publish=true
          fi
          if [ "$publish" = "true" ]; then
            # Fails early if CHANGELOG.md has no section for this version.
            node scripts/release-notes.js "$version" > /dev/null
          fi
          {
            echo "version=$version"
            echo "tag=$tag"
            echo "build=$build"
            echo "publish=$publish"
          } >> "$GITHUB_OUTPUT"
          echo "Version $version: build=$build, publish=$publish"

  windows:
    name: Windows (tests and installers)
    needs: check
    if: needs.check.outputs.build == 'true'
    runs-on: windows-latest
    timeout-minutes: 100
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out the code
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check the code
        run: npm run lint

      - name: Core tests
        run: npm run test:core 2>&1 | tee core-tests.log; exit "${PIPESTATUS[0]}"

      # Two steps depend on things the GitHub runners do not have (the Office cloud font Aptos, and text
      # recognition results that differ slightly there). They are skipped here and run in the normal test run.
      - name: App tests
        if: ${{ !cancelled() }}
        timeout-minutes: 50
        env:
          DP_SKIP_STEPS: '^(Move text over text|Scan in strips)'
        run: npm test 2>&1 | tee app-tests.log; exit "${PIPESTATUS[0]}"

      - name: Report test results
        if: ${{ !cancelled() }}
        run: node scripts/ci-report.js Windows error core-tests.log app-tests.log

      - name: Build the installers (EXE setup, MSI, portable EXE)
        id: build
        if: ${{ !cancelled() && (success() || needs.check.outputs.publish != 'true') }}
        run: npm run dist 2>&1 | tee build.log; exit "${PIPESTATUS[0]}"

      - name: Report a failed build
        if: ${{ !cancelled() && steps.build.outcome == 'failure' }}
        run: node scripts/ci-report.js "Windows build" tail build.log

      - name: Keep the installers as a workflow artifact
        if: ${{ !cancelled() && (success() || needs.check.outputs.publish != 'true') }}
        uses: actions/upload-artifact@v5
        with:
          name: DocPilot-${{ needs.check.outputs.version }}-windows
          if-no-files-found: error
          path: |
            release/DocPilot-Setup-x64.exe
            release/DocPilot-x64.msi
            release/DocPilot-Portable-x64.exe

  mac:
    name: macOS (tests and disk images)
    needs: check
    if: needs.check.outputs.build == 'true'
    runs-on: macos-latest
    timeout-minutes: 100
    steps:
      - name: Check out the code
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The app tests were written for Windows (Windows fonts, Windows behavior); on a Mac some of them fail for
      # that reason. Their results are shown as warnings and do not stop the build or the release.
      - name: Core tests
        id: core
        continue-on-error: true
        run: npm run test:core 2>&1 | tee core-tests.log; exit "${PIPESTATUS[0]}"

      - name: App tests
        id: app
        continue-on-error: true
        timeout-minutes: 50
        run: npm test 2>&1 | tee app-tests.log; exit "${PIPESTATUS[0]}"

      - name: Report test results
        if: ${{ !cancelled() }}
        run: node scripts/ci-report.js macOS warning core-tests.log app-tests.log

      - name: Build the disk images (Apple silicon and Intel)
        id: build
        if: ${{ !cancelled() && (success() || needs.check.outputs.publish != 'true') }}
        env:
          CSC_LINK: ${{ secrets.MAC_CERTIFICATE }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -o pipefail
          if [ -n "$CSC_LINK" ]; then
            # Developer ID signature and notarization by Apple.
            { npm run build && node scripts/mac-helper.js && npx electron-builder --mac --publish never; } 2>&1 | tee build.log
          else
            # Ad hoc signature (also for pull requests, where electron-builder would otherwise not sign at all).
            unset CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID
            CSC_FOR_PULL_REQUEST=true npm run dist:mac 2>&1 | tee build.log
          fi

      - name: Report a failed build
        if: ${{ !cancelled() && steps.build.outcome == 'failure' }}
        run: node scripts/ci-report.js "macOS build" tail build.log

      - name: Check the built apps
        if: ${{ !cancelled() && (success() || needs.check.outputs.publish != 'true') }}
        run: |
          for app in release/mac-arm64/DocPilot.app release/mac/DocPilot.app; do
            echo "== $app"
            codesign --verify --deep --strict --verbose=2 "$app"
            test -x "$app/Contents/Resources/docpilot-scan"
            lipo -archs "$app/Contents/MacOS/DocPilot"
          done
          # The Apple silicon build must start and keep running (the runner is an Apple silicon Mac).
          DP_HIDE=1 DP_USER_DATA="$RUNNER_TEMP/dp-smoke" release/mac-arm64/DocPilot.app/Contents/MacOS/DocPilot &
          pid=$!
          sleep 20
          if ! kill -0 "$pid" 2> /dev/null; then
            echo "::error title=macOS::The app quit right after starting."
            exit 1
          fi
          kill "$pid"
          echo "The app started."

      - name: Keep the disk images as a workflow artifact
        if: ${{ !cancelled() && (success() || needs.check.outputs.publish != 'true') }}
        uses: actions/upload-artifact@v5
        with:
          name: DocPilot-${{ needs.check.outputs.version }}-mac
          if-no-files-found: error
          path: |
            release/DocPilot-mac-arm64.dmg
            release/DocPilot-mac-x64.dmg

  publish:
    name: Publish the release
    needs: [check, windows, mac]
    if: needs.check.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the code
        uses: actions/checkout@v5

      - name: Download the builds
        uses: actions/download-artifact@v5
        with:
          path: release
          merge-multiple: true

      - name: Create checksums
        working-directory: release
        run: sha256sum DocPilot-Setup-x64.exe DocPilot-x64.msi DocPilot-Portable-x64.exe DocPilot-mac-arm64.dmg DocPilot-mac-x64.dmg > SHA256SUMS.txt

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.check.outputs.tag }}
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          node scripts/release-notes.js "$VERSION" > release-notes.md
          files="release/DocPilot-Setup-x64.exe release/DocPilot-x64.msi release/DocPilot-Portable-x64.exe release/DocPilot-mac-arm64.dmg release/DocPilot-mac-x64.dmg release/SHA256SUMS.txt"
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" $files --clobber
          else
            gh release create "$TAG" $files --target "$GITHUB_SHA" --title "DocPilot $VERSION" --notes-file release-notes.md
          fi
