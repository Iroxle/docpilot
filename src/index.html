<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>DocPilot</title>
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval' blob:; worker-src 'self' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data: blob:; connect-src 'self' data: blob:; object-src 'none'; base-uri 'none'">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="app">
  <header id="topbar">
    <div class="tb-left">
      <div class="brand" title="DocPilot"><img src="assets/emblem.svg" alt=""></div>
      <nav id="tabs" role="tablist"></nav>
    </div>
    <div class="tb-center"></div>
    <div class="tb-right"><div id="top-actions"></div></div>
  </header>
  <main id="views">
    <section id="view-home" class="view"></section>
    <section id="view-tools" class="view" hidden></section>
    <section id="view-doc" class="view" hidden>
      <div id="doc-toolbar"></div>
      <div id="propbar" hidden></div>
      <div id="doc-banner" hidden></div>
      <div id="doc-body">
        <aside id="left-panel"></aside>
        <div id="quick-tools"></div>
        <div id="viewer-wrap">
          <div id="ruler-h" hidden></div><div id="ruler-v" hidden></div>
          <div id="viewer" tabindex="0"></div>
          <div id="organizer" hidden></div>
          <div id="findbar" hidden></div>
          <div id="page-controls"></div>
        </div>
        <aside id="right-panel" hidden></aside>
        <nav id="right-rail"></nav>
      </div>
    </section>
  </main>
  <footer id="statusbar"><span id="status-left"></span><span id="status-right"></span></footer>
</div>
<div id="float-root"></div>
<script type="module" src="app.js"></script>
</body>
</html>
